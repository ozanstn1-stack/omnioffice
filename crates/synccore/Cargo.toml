[lints]
workspace = true

[package]
name = "synccore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Local-first cloud sync foundation (WebDAV) for OmniOffice"

[lib]
name = "synccore"
path = "src/lib.rs"

[features]
# Typed command bindings (tauri-specta, #316): the sync state the commands return.
bindings = ["dep:specta"]

[dependencies]
# Blocking client: every network call runs inside a Tauri spawn_blocking worker,
# so the UI thread is never blocked. rustls keeps the crate free of OpenSSL /
# native TLS dependencies, which is what makes Windows + Android both work.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset", "json"] }
# OAuth PKCE: the S256 challenge is a base64url-encoded SHA-256 digest.
base64 = "0.23"
quick-xml = "0.42.0"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# LAN sync (crates/synccore/src/lan.rs, C14): the pairing handshake runs on a
# self-signed certificate and every later connection pins that certificate's
# SHA-256, so rustls/rcgen are the only TLS pieces needed. `ring` is the
# provider both crates already use; HMAC-SHA256 authenticates each request with
# the key established at pairing.
getrandom = "0.2"
hmac = "0.12"
# Code-authenticated LAN pairing (E1/3): SPAKE2 over the six-digit code, so the
# code never crosses the wire and a relayed handshake cannot be turned into a
# pin. curve25519-dalek (the crate's group arithmetic) is BSD-3-Clause, which
# deny.toml already allows.
spake2 = "0.4"
# mDNS/DNS-SD discovery for the LAN sync (C14 phase 2). Sync API, no async
# runtime; the logging and async features stay off.
mdns-sd = { version = "0.21", default-features = false }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
uuid = { version = "1", features = ["v4"] }
# tauri-specta's type layer, pinned with the app crate's (docs/dependencies.md).
specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"
