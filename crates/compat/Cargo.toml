[lints]
workspace = true

[package]
name = "compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Compatibility corpus scorer (import -> export -> re-import, import -> PDF -> page comparison)"
# Never published: the path dependencies on the workspace crates are internal
# and cargo-deny's wildcard policy treats a publishable crate as one that must
# carry version requirements.
publish = false

[dependencies]
officecore = { path = "../officecore" }
pdfcore = { path = "../pdfcore" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
