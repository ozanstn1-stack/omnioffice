[lints]
workspace = true

[package]
name = "pdfcore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Local-first PDF processing core for PDF Swiss Army Knife"

[lib]
name = "pdfcore"
path = "src/lib.rs"

[dependencies]
# Real digital signatures (crates/pdfcore/src/sign.rs). Every crypto crate here
# is pure Rust so the same code compiles for Windows and Android: no OpenSSL,
# no CNG requirement, no native toolchain.
ab_glyph = "0.2.32"
cbc = { version = "0.1", features = ["alloc"] }
cms = { version = "0.2", features = ["std"] }
const-oid = "0.9"
der = { version = "0.8", features = ["std", "oid", "derive"] }
des = "0.8"
hmac = "0.12"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
lopdf = "0.45.0"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "std"] }
pdfium-render = "0.9.4"
pkcs12 = { version = "0.1", features = ["kdf"] }
pkcs8 = "0.10"
# PBES2 only; the PKCS#12 PBES1 (3DES) path is implemented in sign.rs because
# pkcs5 intentionally refuses PBES1 decryption. `sha1-insecure` is needed to
# accept the SHA-1 based PBKDF2 parameters Windows still writes by default.
pkcs5 = { version = "0.7", features = ["pbes2", "3des", "sha1-insecure", "alloc"] }
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = "0.3"
getrandom = "0.2"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
# Test-only: generate throwaway self-signed identities and build PKCS#12
# containers so the real parse/decrypt/verify paths are exercised end to end.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
der = { version = "0.8", features = ["std", "oid", "derive"] }
des = "0.8"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
pkcs5 = { version = "0.7", features = ["pbes2", "3des", "sha1-insecure", "alloc"] }
rand = "0.8"
rcgen = "0.13"
sha1 = "0.10"
sha2 = "0.10"
criterion = { version = "0.8", features = ["html_reports"] }

# Trend benchmark for the engine-free compression path (pdfium-backed raster
# compression is not benchable on the Linux CI runner).
[[bench]]
name = "pdf_ops"
harness = false
