[lints]
workspace = true

[package]
name = "aicore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DeepSeek API client and prompt pipeline for OmniOffice"

[lib]
name = "aicore"
path = "src/lib.rs"

[features]
# Typed command bindings (tauri-specta, #316): the prompt options and results the AI commands use.
bindings = ["dep:specta"]

[dependencies]
# tauri-specta's type layer, pinned with the app crate's (docs/dependencies.md).
specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
