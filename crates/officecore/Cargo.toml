[lints]
workspace = true

[package]
name = "officecore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Local-first document engine for OmniOffice (Writer, Calc, Impress)"

[lib]
name = "officecore"
path = "src/lib.rs"

[features]
# Typed command bindings (tauri-specta, #316): the document reports and invoice data the office commands return.
bindings = ["dep:specta", "dep:specta-typescript"]

[dependencies]
# tauri-specta's type layer, pinned with the app crate's (docs/dependencies.md).
specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }
specta-typescript = { version = "0.0.13", optional = true }
ab_glyph = "0.2.32"
base64 = "0.23"
calamine = "0.37.0"
# Word 97-2003 / PowerPoint 97-2003 are OLE2 Compound File Binary containers;
# `legacy.rs` reads their streams without a native Office dependency.
cfb = "0.15"
crc32fast = "1"
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
lopdf = "0.46.0"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tempfile = "3.27.0"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

# Trend benchmarks for the importers; run by the master CI job and compared
# through the uploaded criterion report (see .github/workflows/desktop.yml).
[[bench]]
name = "parse"
harness = false
