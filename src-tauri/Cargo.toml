[lints]
workspace = true

[package]
name = "pdf-swiss-army-knife"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OmniOffice - local-first desktop office and PDF toolkit"
rust-version.workspace = true
# Never published: the path dependencies on the workspace crates are internal
# and cargo-deny's wildcard policy treats a publishable crate as one that must
# use registry versions.
publish = false

[lib]
name = "pdf_sak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-android-fs = "29"
# Only for the heavy-work semaphore (already in the tree through Tauri).
tokio = { version = "1", features = ["rt", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
aicore = { path = "../crates/aicore" }
officecore = { path = "../crates/officecore" }
lopdf = "0.45.0"
pdfcore = { path = "../crates/pdfcore" }
time = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
synccore = { path = "../crates/synccore" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

# The AI extraction test writes real DOCX/XLSX/PPTX fixtures with the engines.
[dev-dependencies]
tempfile = "3"

# OS credential vault for OAuth tokens (Windows Credential Manager, macOS
# Keychain, Secret Service). The Android build uses the app's secret file
# fallback and reports it in the UI instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "4"

# One window per user: opening a second document in Explorer hands its
# arguments to the running instance instead of starting another app. Desktop
# only (Android activities are already singleTask); it has no npm counterpart,
# so scripts/check-tauri-plugin-versions.mjs has nothing to pair it with.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
