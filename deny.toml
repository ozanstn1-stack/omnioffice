# cargo-deny configuration.
#
# One place for the dependency policy: the CI "Dependency audit" job runs
# `cargo deny check` (advisories, licenses, bans and sources), so an
# unreviewed advisory or a new license fails the build instead of scrolling
# past in a log.
#
# Every entry in the ignore list below carries an explicit owner and a review
# date (see the comments). Reviewing an exception means rereading the advisory,
# confirming the reachability reasoning still holds, and updating the
# "reviewed ... review by ..." line. If the review date has passed, remove the
# ignore (and fix the dependency) or re-justify it in the same change.

[advisories]
# Unmaintained-crate notices are informational: they do not by themselves make
# a shipped binary vulnerable. Restricting them to direct workspace
# dependencies keeps the build honest (a direct dependency going unmaintained
# still fails) while not blocking on the transitive glib/unic-*/ttf-parser
# notices Tauri's GTK stack pulls in.
unmaintained = "workspace"

ignore = [
  # RUSTSEC-2023-0071 - rsa 0.9.x Marvin timing side channel.
  # reachability: the app signs PDFs locally with a user-supplied key and never
  #   exposes a signing oracle; the attack needs a timing measurement the app
  #   does not offer. No fixed release exists.
  # owner: @ozanstn1-stack
  # reviewed 2026-10-01; review by 2027-01-01 (or when rsa ships a fix, or the
  #   signing path moves to another implementation).
  "RUSTSEC-2023-0071",
  # RUSTSEC-2026-0367/-0368/-0369 - zip < 9 extraction issues: SUID/SGID bits
  # preserved through extraction, `ZipArchive::extract` symlinks whose targets
  # escape the destination, and permissions applied through symlinks. All three
  # are in `ZipArchive::extract` / `ZipStreamReader::extract`.
  # reachability: officecore reads XLSX through the vendored calamine 0.37,
  #   which now uses zip 9 (fixed); `extract(` is not called in this workspace.
  #   The remaining zip 4.6.1 comes from tauri-plugin-updater, which extracts
  #   the update package it downloaded over HTTPS from our own release after
  #   Tauri verifies the archive's Ed25519 signature - a tampered archive is
  #   rejected before extraction.
  # fix status: tauri-plugin-updater 2.x still pins zip 4; no released upgrade
  #   path exists, so the exception stays scoped to the updater.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  # RUSTSEC-2026-0387 - crypto-bigint 0.5.5 constant-time operations leak
  # timing variability (via p256/ecdsa/elliptic-curve).
  # reachability: the app signs and verifies PDFs locally with a user-supplied
  #   key; there is no remote signing oracle or timing measurement channel.
  # fix status: no fixed 0.5.x release; the fix needs p256/elliptic-curve 0.14
  #   (crypto-bigint 0.6), tracked as a separate migration.
  # owner: @ozanstn1-stack
  # reviewed 2026-10-24; review by 2027-01-24 (or when p256 0.14 lands).
  "RUSTSEC-2026-0387",
]

# Licenses the shipped dependency tree may use: permissive only. A new copyleft
# dependency fails the build and has to be reviewed (and either replaced or the
# allow list extended deliberately, which makes the resulting obligation
# explicit).
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions are common in the Tauri/GTK stack and are visible
# in the build output; keep them as a warning, but refuse wildcard version
# requirements outright. Internal workspace crates are path-only by design, so
# path wildcards stay allowed.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]