[workspace]
members = [
    "crates/aicore",
    "crates/compat",
    "crates/officecore",
    "crates/pdfcore",
    "crates/synccore",
    "crates/turkish",
    "src-tauri",
]
# The fuzz crate needs nightly + libfuzzer; it is built by its own CI job and
# must not be pulled into `cargo test --workspace`.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "6.6.0"
edition = "2021"
# Declared MSRV, in one place for every crate.
#
# The dependency tree sets the floor, not taste: scanning every crate in
# Cargo.lock that ships a manifest gives a maximum requirement of 1.89 (aes
# 0.9.3), with calamine, darling, encoding_rs, icu_*, image, lopdf, time and
# weezl all at 1.88 and cpubits on edition 2024 (1.85). The declaration here
# used to say 1.82, which had not built for a long time; CI never noticed
# because every job used the stable toolchain. `cargo +1.89.0 check` passes and
# 1.88 does not, so the `msrv` job in .github/workflows/desktop.yml pins 1.89.0
# and fails when this line and the pin disagree. The app crate (src-tauri) is
# outside that check: tauri-plugin-updater and tauri-plugin-process need Rust
# 1.90, and the msrv job only checks the library crates listed below.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ozanstn1-stack/omnioffice"
authors = ["OmniOffice contributors"]

# Lint policy for every crate (each member opts in with `[lints] workspace = true`).
#
# The CI gate is `cargo clippy --workspace --all-targets -- -D warnings`
# (npm run lint:rust). Everything is denied by default; the entries below are
# deliberate exceptions with a reason, not a way to silence findings.
[workspace.lints.clippy]
# Long, flat parameter lists are the shape of this code base's drawing and
# export helpers (page, x, y, width, height, colour, ...). Bundling them into a
# struct is a refactor with real regression risk and no behaviour win.
too_many_arguments = "allow"
# `DocUtil::mul` is a public helper on the PDF object model whose name mirrors
# the PDF operator; renaming it would churn every call site for a lint that is
# about accidental trait confusion.
should_implement_trait = "allow"
# The forms/annotation helpers take and return nested lopdf containers; the
# aliases that would satisfy the lint make the signatures harder to read.
type_complexity = "allow"
# Boxing a variant of the public signing enums would change their shape for
# every caller to save a few bytes on a stack-local value.
large_enum_variant = "allow"
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# `panic = "unwind"` (the default, spelled out because it is load-bearing):
# the untrusted parsers run in a worker process, and when that process cannot
# be spawned the app parses in-process behind `catch_unwind` (see
# src-tauri/src/worker.rs). `abort` would make that belt useless - the very
# bug the v6.0.0 audit found in the #273 guard. The worker process remains the
# primary containment; this is the fallback for the dev/test path.
panic = "unwind"
strip = true

[patch.crates-io]
# See vendor/calamine/README.md: checked arithmetic for hostile cell refs.
calamine = { path = "vendor/calamine" }
