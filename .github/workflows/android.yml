name: Android

# Third-party actions are pinned to commit SHAs; Dependabot
# (.github/dependabot.yml, github-actions ecosystem) keeps them current.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  # On-demand Android CI on a pull request: add the `android-ci` label. Only
  # `labeled` - not `opened` or `synchronize` - so an ordinary push creates no
  # skipped Android checks. To re-run after new commits, remove the label and
  # add it again.
  pull_request:
    types: [labeled]

permissions:
  contents: read


jobs:
  build:
    name: Build ${{ matrix.abi }} APK and AAB
    runs-on: ubuntu-24.04
    # Runs at tag, by dispatch, or when the `android-ci` label is added to a PR.
    if: github.event_name != 'pull_request' || github.event.label.name == 'android-ci'
    # Do not burn a 30-minute Android build on a commit whose version files
    # disagree (see release.yml for the same gate).
    needs: version-consistency
    timeout-minutes: 90
    strategy:
      # Both arms report, so one failed ABI still tells us why.
      fail-fast: false
      matrix:
        include:
          # `target` is the Tauri CLI's --target, `abi` is the directory inside
          # the package (and the suffix inside the artifact names).
          - abi: arm64-v8a
            target: aarch64
            rust: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7
            rust: armv7-linux-androideabi
    env:
      # A pull request never receives the release keystore: it builds
      # debug-signed, and the release steps below are tag-gated anyway.
      ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android NDK and platform
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;27.3.13750724" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ matrix.abi }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-${{ matrix.abi }}-
            ${{ runner.os }}-cargo-android-

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # One arm runs the frontend suite; both identical arms would only burn a
      # runner. The ABI does not change the TypeScript.
      - name: Type check and frontend tests
        if: matrix.abi == 'armeabi-v7a'
        run: |
          npx tsc --noEmit
          npm test

      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/pdfsak-release.jks
          {
            echo "storeFile=pdfsak-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      # A release has to be signed. Without the secret the build silently falls
      # back to the debug keystore, and the APK/AAB would still be uploaded and
      # attached to the GitHub release as if it were a production build.
      # Manual (workflow_dispatch) runs may stay debug-signed for sideloading.
      - name: Require the release keystore (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: refusing to publish a debug-signed release."
            exit 1
          fi

      # Only this ABI's engines: a leaked directory from another ABI would ship
      # code the package cannot run (verify-android-abis.sh fails on it too).
      - name: Fetch Android engines
        run: pwsh -NoProfile -File scripts/fetch-engines-android.ps1 -Abis ${{ matrix.abi }}

      # Desktop clippy never compiles the `cfg(target_os = "android")` code;
      # this runs it for the Android target so Android-only dead code and
      # unused variables fail here instead of slipping through. The Tauri CLI
      # sets the NDK compilers for its own builds; plain cargo needs them for
      # the dependencies' C code.
      - name: Clippy (aarch64-linux-android)
        if: matrix.abi == 'arm64-v8a'
        run: |
          set -e
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android24-clang"
          rustup component add clippy
          cargo clippy -p pdf-swiss-army-knife --lib --target aarch64-linux-android -- -D warnings

      - name: Lockfile preflight
        # `tauri build` runs cargo through the CLI; this check makes a stale
        # Cargo.lock fail here instead of resolving new versions mid-release.
        run: cargo metadata --locked --format-version 1 > /dev/null

      # `--apk` and `--aab` are independent flags, so one Gradle run per ABI
      # produces both artifacts. The two ABIs run as separate jobs.
      - name: Build the APK and AAB for this ABI
        run: |
          set -e
          npm run tauri android build -- --apk --aab --ci --target ${{ matrix.target }}
          mkdir -p release-artifacts
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2)
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2)
          cp "$apk" "release-artifacts/OmniOffice-Android-$version-${{ matrix.abi }}.apk"
          cp "$aab" "release-artifacts/OmniOffice-Android-$version-${{ matrix.abi }}.aab"
          ls -lh release-artifacts

      - name: Upload this ABI's packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-abi-${{ matrix.abi }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  # The emulator is x86_64, and the Tauri Gradle plugin reads the ABI list from
  # -P flags (RustPlugin.kt), so this job builds one library instead of four.
  tests:
    name: Android unit, instrumented and launch tests
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.label.name == 'android-ci'
    needs: version-consistency
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android NDK and platform
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;27.3.13750724" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-emulator-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-emulator-
            ${{ runner.os }}-cargo-android-

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Same command as before the split: the test APK's assets stay identical
      # (abiFilters below drop the arm libraries from it).
      - name: Fetch Android engines
        run: pwsh -NoProfile -File scripts/fetch-engines-android.ps1 -Abis arm64-v8a,armeabi-v7a

      - name: Lockfile preflight
        run: cargo metadata --locked --format-version 1 > /dev/null

      # The universal test task wants every ABI's libpdf_sak_lib.so unless the
      # ABI list says otherwise; the emulator is x86_64, so only that one is
      # built here (RustPlugin.kt reads -PabiList/-ParchList/-PtargetList).
      - name: Build the x86_64 Android library (for the emulator)
        run: npm run tauri android build -- --apk --ci --target x86_64

      - name: Android unit tests
        working-directory: src-tauri/gen/android
        run: sh gradlew :app:testUniversalDebugUnitTest --no-daemon -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64

      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (open-with pipeline) and launch smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          # The runner executes each script line in its own shell, so the test
          # and the logcat capture share one line. On failure the crash lines
          # are printed and the full logcat is kept for the artifact below.
          # The last line is the launch smoke test (scripts/android-launch-smoke.sh):
          # the app is started in its own process and must reach the Rust side.
          script: |
            adb logcat -c
            cd src-tauri/gen/android && ./gradlew :app:connectedUniversalDebugAndroidTest --no-daemon -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 || { adb logcat -d -v threadtime > ../../../android-logcat.txt; grep -E "AndroidRuntime|FATAL|F DEBUG|backtrace|panicked|RustStdoutStderr|Tauri|libc  " ../../../android-logcat.txt | tail -n 250; exit 1; }
            sh scripts/android-launch-smoke.sh

      - name: Upload logcat on test failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-logcat
          path: android-logcat.txt
          if-no-files-found: ignore

  # Verifying and publishing happens in one place, after both arms and the
  # tests pass; the release is only attached when the tests are green, as before.
  assemble:
    name: Verify and publish Android packages
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.label.name == 'android-ci'
    needs: [build, tests]
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # apksigner and aapt come from build-tools; the identity check reads them.
      - name: Install Android build-tools
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"

      - name: Download the per-ABI packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-abi-*
          merge-multiple: true
          path: release-artifacts

      - name: Checksums
        run: |
          (cd release-artifacts && sha256sum *.apk *.aab > SHA256SUMS-android.txt)
          ls -lh release-artifacts

      # An APK can quietly carry another ABI's libraries (the Tauri plugin
      # copies every directory under jniLibs) and the two APKs can end up with
      # different keys; both only surface on a device or in a store review. The
      # check reads the files themselves, before anything is published.
      - name: Verify the ABI matrix (per-ABI libraries, ELF shape, one signer)
        # A pull request has no keystore, so its package is unsigned by design;
        # everywhere else a missing signature fails the build.
        run: bash .github/scripts/verify-android-abis.sh release-artifacts ${{ github.event_name != 'pull_request' && '--require-signature' || '' }}

      # Catalogues and installed users key the identity on these two facts (#502):
      # a monotonic version code and an unchanged signing certificate.
      - name: Verify release identity (versionCode + signing key continuity)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-android-release.sh

      - name: Upload APKs and AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          path: |
            release-artifacts/*.apk
            release-artifacts/*.aab
            release-artifacts/SHA256SUMS-android.txt
          if-no-files-found: error

      # The Windows release job creates the GitHub release; wait for it briefly
      # and create it here if this job wins the race (tag push starts both).
      - name: Attach Android assets to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          for i in $(seq 1 30); do
            if gh release view "$tag" >/dev/null 2>&1; then break; fi
            echo "waiting for release $tag ($i/30)"; sleep 20
          done
          if ! gh release view "$tag" >/dev/null 2>&1; then
            version=$(node -p "require('./package.json').version")
            # Only this version's CHANGELOG section becomes the release body.
            node scripts/changelog-section.mjs "$version" > release-notes.md
            gh release create "$tag" --title "OmniOffice $tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" \
            release-artifacts/*.apk release-artifacts/*.aab \
            release-artifacts/SHA256SUMS-android.txt --clobber

  # The same provenance the desktop assets get, for the four packages this
  # workflow publishes:
  #   slsa-verifier verify-artifact <file> \
  #     --provenance-path omnioffice-<tag>-android.intoto.jsonl \
  #     --source-uri github.com/<owner>/<repo> --source-tag <tag>
  provenance:
    name: Build provenance (Android assets)
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [assemble]
    permissions:
      actions: read
      contents: write
      id-token: write
    outputs:
      subjects: ${{ steps.subjects.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks
          path: built
      - name: Subjects (the files this workflow published)
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          node scripts/provenance-subjects.mjs hash --dir built > hashes.txt
          subjects=$(node scripts/provenance-subjects.mjs encode hashes.txt)
          echo "subjects=$subjects" >> "$GITHUB_OUTPUT"
      - name: The subjects are the published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECTS: ${{ steps.subjects.outputs.subjects }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --dir published --pattern '*.apk' --pattern '*.aab' --pattern 'SHA256SUMS-android.txt'
          node scripts/provenance-subjects.mjs check-published --subjects-b64 "$SUBJECTS" --release-dir published

  provenance-asset:
    name: Publish the Android provenance envelope
    needs: provenance
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.provenance.outputs.subjects }}
      upload-assets: true
      provenance-name: omnioffice-${{ github.ref_name }}-android.intoto.jsonl

  version-consistency:
    name: Android version consistency
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.label.name == 'android-ci'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same script the pull request and the release build run: version
      # files and Android metadata agree, and this version's CHANGELOG section
      # and store changelog exist before an APK is built for it.
      - name: Release guard (version files, CHANGELOG section, store changelog)
        run: node scripts/release-guard.mjs --tag "$GITHUB_REF_NAME"
