name: Android

# Third-party actions are pinned to commit SHAs; Dependabot
# (.github/dependabot.yml, github-actions ecosystem) keeps them current.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs and AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android NDK and platform
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;27.3.13750724" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check and frontend tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/pdfsak-release.jks
          {
            echo "storeFile=pdfsak-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      # A release has to be signed. Without the secret the build silently falls
      # back to the debug keystore, and the APK/AAB would still be uploaded and
      # attached to the GitHub release as if it were a production build.
      # Manual (workflow_dispatch) runs may stay debug-signed for sideloading.
      - name: Require the release keystore (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: refusing to publish a debug-signed release."
            exit 1
          fi

      - name: Fetch Android engines
        run: pwsh -NoProfile -File scripts/fetch-engines-android.ps1 -Abis arm64-v8a,armeabi-v7a

      # The Tauri CLI builds the "universal" flavor restricted to the requested
      # target, so each run overwrites the previous APK - collect per target.
      - name: Build arm64 APK
        run: |
          set -e
          npm run tauri android build -- --apk --ci --target aarch64
          mkdir -p release-artifacts
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2)
          cp "$apk" \
             "release-artifacts/OmniOffice-Android-$version-arm64-v8a.apk"

      - name: Build armv7 APK
        run: |
          set -e
          npm run tauri android build -- --apk --ci --target armv7
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2)
          cp "$apk" \
             "release-artifacts/OmniOffice-Android-$version-armeabi-v7a.apk"

      - name: Build arm64 AAB
        run: |
          set -e
          npm run tauri android build -- --aab --ci --target aarch64
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2)
          cp "$aab" \
             "release-artifacts/OmniOffice-Android-$version-arm64-v8a.aab"

      - name: Build armv7 AAB
        run: |
          set -e
          npm run tauri android build -- --aab --ci --target armv7
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2)
          cp "$aab" \
             "release-artifacts/OmniOffice-Android-$version-armeabi-v7a.aab"
          (cd release-artifacts && sha256sum *.apk *.aab > SHA256SUMS-android.txt)
          ls -lh release-artifacts

      # JVM unit tests for the Android-only logic: the open-with/share intent
      # pipeline (untrusted display names, extension whitelist, 256 MB copy
      # cap). They run after the Rust artifacts are warm, so Gradle does not
      # rebuild the native library just for the tests. The Tauri Gradle plugin
      # defines the `arm`/`universal` flavors, so the task is flavor-qualified.
      - name: Android unit tests
        working-directory: src-tauri/gen/android
        run: sh gradlew :app:testUniversalDebugUnitTest --no-daemon

      # Instrumented tests run the real content:// open-with pipeline on an
      # emulator (served by a test DocumentsProvider). The Tauri Gradle plugin
      # builds a "universal" flavor whose test task wants every ABI's
      # libpdf_sak_lib.so, so the x86_64 (emulator) and x86 libraries are built
      # here first; the small test APK is then assembled against them.
      - name: Build x86_64 and i686 Android libraries (for the emulator)
        run: |
          set -e
          npm run tauri android build -- --apk --ci --target x86_64
          npm run tauri android build -- --apk --ci --target i686
      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests (open-with pipeline)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: cd src-tauri/gen/android && ./gradlew :app:connectedUniversalDebugAndroidTest --no-daemon

      - name: Upload APKs and AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apks
          path: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          if-no-files-found: error

      # The Windows release job creates the GitHub release; wait for it briefly
      # and create it here if this job wins the race (tag push starts both).
      - name: Attach Android assets to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          for i in $(seq 1 30); do
            if gh release view "$tag" >/dev/null 2>&1; then break; fi
            echo "waiting for release $tag ($i/30)"; sleep 20
          done
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "OmniOffice $tag" --notes-file CHANGELOG.md
          fi
          gh release upload "$tag" \
            release-artifacts/*.apk release-artifacts/*.aab \
            release-artifacts/SHA256SUMS-android.txt --clobber

  version-consistency:
    name: Android version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tauri.conf.json and Android metadata agree
        run: |
          node -e "
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')).version;
            const props = fs.readFileSync('src-tauri/gen/android/app/tauri.properties','utf8');
            const name = (props.match(/versionName=([^\r\n]+)/) || [])[1];
            const code = (props.match(/versionCode=([0-9]+)/) || [])[1];
            const [major, minor, patch] = version.split('.').map(Number);
            const expectedCode = String(major * 1000000 + minor * 1000 + patch);
            console.log({ version, name, code, expectedCode });
            if (name !== version) throw new Error('Android versionName does not match tauri.conf.json');
            if (code !== expectedCode) throw new Error('Android versionCode is not consistent');
            const tag = process.env.GITHUB_REF_NAME || '';
            if (tag.startsWith('v') && tag.slice(1) !== version) throw new Error('tag does not match version');
          "
