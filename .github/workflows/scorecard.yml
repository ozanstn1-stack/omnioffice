name: Scorecard

# OpenSSF Scorecard grades the repository's own security posture (branch
# protection, dependency updates, dangerous workflow patterns, pinned
# dependencies) instead of asserting it in prose, and the result is published
# so the score reflects a real run.
#
# The action rejects every event that is neither a pull request nor the default
# branch (`only default branch is supported`), which is why the working-branch
# proof is a pull-request run filtered to this file: it publishes nothing and
# still exercises the action, the permissions and the SARIF upload.
#
# Third-party actions are pinned to commit SHAs; Dependabot
# (.github/dependabot.yml, github-actions ecosystem) keeps them current.

on:
  # Only changes to this file: an unfiltered pull_request trigger would add a
  # check to every pull request for no signal.
  pull_request:
    paths: [".github/workflows/scorecard.yml"]
  # Re-score when a protection rule changes: that is one of the graded checks,
  # so it is exactly when the score moves.
  branch_protection_rule:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: ["master"]
  workflow_dispatch:

# The publisher validates the workflow it runs in: top-level permissions stay
# read-only, and the job asks for what it needs below.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Scorecard reads the workflow runs of the repository.
      actions: read
      # Uploading the SARIF report.
      security-events: write
      # Publishing the score (`publish_results`).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # The action turns publishing off for a pull-request event by itself,
          # so a filtered test run never reaches the public API.
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: results.sarif
