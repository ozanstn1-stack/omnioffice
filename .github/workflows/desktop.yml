name: Desktop

# Third-party actions are pinned to commit SHAs; Dependabot
# (.github/dependabot.yml, github-actions ecosystem) keeps them current.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static checks that do not need a compiler or the native engines. Kept in
  # its own job so a lint failure is reported in seconds instead of waiting for
  # the Rust matrix.
  lint:
    name: Lint (ESLint, Prettier, rustfmt, i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The formatting gate diffs the pushed range against its base, so the
          # base commit has to be in the clone.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: rustfmt
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Translation tables (en/tr parity)
        run: npm run i18n:audit -- --check
      # `tauri build` refuses an npm/Rust plugin version mismatch, and a
      # Dependabot bump of only one side shipped exactly that once.
      - name: Tauri plugin version sync
        run: node scripts/check-tauri-plugin-versions.mjs
      - name: Formatting gate (files changed by this change)
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm run format:gate -- --all-changed
          npm run format:gate:rust -- --all-changed
      # The one-off backlog is burned down (v3.5.5); this keeps the whole tree
      # formatted, not just the files a change touches.
      - name: Formatting (repository-wide)
        run: |
          npm run format:check
          npm run fmt:rust:check
      # Every engine download must be covered by a pinned SHA-256. The fetch
      # scripts themselves are the source of truth (they hard-fail on an
      # unpinned download), so this only proves the lock has no gaps before a
      # Windows runner spends time downloading.
      - name: Engine artifact lock coverage
        run: |
          pwsh -NoProfile -File scripts/fetch-engines.ps1 -VerifyLock
          pwsh -NoProfile -File scripts/fetch-engines-android.ps1 -VerifyLock

  frontend:
    name: Frontend (tests, type check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests (with coverage)
        run: npm run test:coverage
      - name: Production build
        run: npx vite build
      - name: Bundle budget
        run: npm run bundle:check

  # Android-only compile errors (a desktop-only API behind the wrong cfg, a
  # method missing from the mobile plugin build, …) do not show up in the
  # desktop workspace check. Cross-checking the mobile target on every push/PR
  # is what keeps a release tag from failing on Android for a reason that was
  # catchable here in minutes. It caught the `plugin_install_from_dialog`
  # regression that broke the v3.2.1 Android build.
  android-target:
    name: Android target compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Android NDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;27.3.13750724" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - run: npm ci
      # The Tauri build script embeds the frontend, so ../dist has to exist.
      - name: Frontend for the Tauri build script
        run: npm run build
      - name: Stub the engine resources
        run: |
          mkdir -p src-tauri/resources/engines
          echo "Engine binaries are fetched by scripts/fetch-engines.ps1." > src-tauri/resources/engines/README.txt
      - name: cargo check (aarch64-linux-android)
        shell: bash
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang"
          cargo check -p pdf-swiss-army-knife --target aarch64-linux-android

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # The src-tauri build script embeds the frontend, so ../dist has to exist
      # before the workspace (including src-tauri) compiles.
      - name: Frontend for the Tauri build script
        run: |
          npm ci
          npm run build
      # Engine binaries are fetched at build time, but tauri-build validates the
      # resources glob even for `cargo test`; a placeholder keeps it matching.
      - name: Stub the engine resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources/engines
          echo "Engine binaries are fetched by scripts/fetch-engines.ps1." > src-tauri/resources/engines/README.txt
      # The bundled engines are Windows binaries; only the Windows runner can
      # exercise the engine-dependent pdfcore integration tests (raster
      # compression, OCR, rendering). Linux/macOS run the engine-free suites
      # plus a full workspace compile so cross-platform build breakage shows up.
      - name: Fetch engines (Windows)
        if: runner.os == 'Windows'
        run: npm run engines:fetch
      # Clippy runs on the runner that has the full engine set so the
      # cfg(windows) paths are compiled too.
      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests (Windows, with engines)
        if: runner.os == 'Windows'
        run: cargo test --workspace
      # officecore has no native engine dependency at all, so its integration
      # tests (golden fixtures, format round trips, the README contract) run on
      # every platform. pdfcore and aicore stay on --lib: most of their
      # integration tests need pdfium/tesseract, which only ship for Windows.
      - name: Engine-free tests
        if: runner.os != 'Windows'
        run: |
          cargo test -p officecore
          cargo test -p pdfcore -p aicore --lib
      - name: Workspace compile
        if: runner.os != 'Windows'
        run: cargo build --workspace
      - name: Release build (library crates)
        run: cargo build --release -p officecore -p pdfcore -p aicore

  # The workspace declares a rust-version; this job proves the declaration is
  # true instead of trusting it. Cargo.lock already contains crates that need
  # edition 2024 - the declaration used to say 1.82, which no longer built.
  msrv:
    name: MSRV (declared Rust version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master branch
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: The pin below and Cargo.toml must agree
        run: |
          declared=$(node -p "require('fs').readFileSync('Cargo.toml','utf8').match(/rust-version = \"([^\"]+)\"/)[1]")
          echo "Cargo.toml declares rust-version $declared"
          if [ "$declared" != "1.89" ]; then
            echo "::error::Cargo.toml declares $declared but this job pins 1.89.0 - bump both together."
            exit 1
          fi
      - name: Library crates build with the declared MSRV
        run: cargo check -p officecore -p pdfcore -p aicore -p synccore

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chrome-extension/package-lock.json
      - run: npm ci
      # Fonts and pdf.js assets are generated (public/fonts is not in git).
      - run: npm run assets
      - run: npm run test
      - run: npm run build
      - run: npm run verify
      # Headless Chrome runs the in-page self test (pdf.js worker + canvas) and
      # the context-menu deep-link checks against the built dist. The GitHub
      # ubuntu image ships Google Chrome; the preview server serves the build.
      - name: Browser self test (headless Chrome)
        run: |
          npm run preview &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID" EXIT
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4173/app.html > /dev/null; then break; fi
            sleep 1
          done
          npm run selftest:browser

  # Real end-to-end smoke: the debug binary is launched by tauri-driver and
  # driven over WebDriver. Engine-free on the Linux runner (the tool grid and
  # Settings navigation); the Windows variant can add `e2e:smoke:pdf`.
  e2e:
    name: Desktop E2E (tauri-driver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Linux window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            patchelf webkit2gtk-driver xvfb dbus-x11
      - run: npm ci
      - name: Stub the engine resources
        run: |
          mkdir -p src-tauri/resources/engines
          echo "Engine binaries are fetched by scripts/fetch-engines.ps1." > src-tauri/resources/engines/README.txt
      # The frontend has to be embedded (a plain `cargo build` produces a dev
      # binary that points at the Vite dev server and cannot load in CI).
      - name: Build the app (debug, embedded frontend)
        run: npm run tauri -- build --debug --no-bundle
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Smoke test (Xvfb)
        run: xvfb-run -a npm run e2e:smoke
      # Engine-free real flows: Writer type -> save, PDF merge and Studio
      # sanitize all run through the same WebDriver session harness.
      - name: Deep flows (Xvfb)
        run: xvfb-run -a npm run e2e:flows
      # When a flow fails, the app's own log records the dev-context line and
      # any frontend error; without it a WebDriver failure is hard to explain.
      - name: App log on E2E failure
        if: failure()
        run: |
          find "$HOME/.local/share" -name frontend.log -print -exec cat {} \; 2>/dev/null || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots
          path: e2e/artifacts/
          if-no-files-found: ignore

  # Short nightly fuzzing on master keeps the hardened ZIP/XML/reader layers
  # exercised without making every pull request wait for it.
  fuzz:
    name: Fuzz (nightly, short)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "fuzz -> target"
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-fuzz
      # `--target` is explicit on purpose: the prebuilt cargo-fuzz binary from
      # install-action is linked against musl, and its "current platform"
      # default makes cargo build for x86_64-unknown-linux-musl, where the
      # address sanitizer cannot link (static libc). Pin the runner's real
      # target instead.
      - name: ZIP reader
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu zip_archive -- -max_total_time=45
      - name: XML parser
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu xml_parse -- -max_total_time=30
      - name: Office readers
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu office_readers -- -max_total_time=60

  # Criterion trend benchmarks with a regression gate. The previous master
  # run's means are cached; a >15 % mean regression fails the job, a >7.5 %
  # one warns, and the updated baseline is saved only when the check passed.
  # The uploaded report stays the detailed comparison point.
  bench:
    name: Benchmarks (criterion)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Restore benchmark baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench-baseline.json
          key: criterion-baseline-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            criterion-baseline-${{ github.ref_name }}-
      - name: Run benchmarks
        run: cargo bench -p officecore --bench parse -p pdfcore --bench pdf_ops
      - name: Check benchmark regression
        run: node scripts/check-bench-regression.mjs
      # Only a green check may advance the baseline; a failed comparison keeps
      # the older (good) numbers so the regression stays visible next run.
      - name: Save benchmark baseline
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bench-baseline.json
          key: criterion-baseline-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload criterion report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-report
          path: target/criterion/
          if-no-files-found: error

  # Blocking on purpose: a known-vulnerable dependency is a release blocker,
  # not a note in the log. Fix or override an advisory explicitly.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (high)
        run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          # Prebuilt binaries: keeps the audit job under a minute instead of
          # compiling these tools on every push.
          tool: cargo-audit,cargo-deny
      # cargo audit is the quick gate; deny.toml is the reviewed policy with an
      # owner and a review date for every ignored advisory, plus the license,
      # ban and source rules.
      - name: cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071
      # `deny.toml` owns the advisory policy (owned, time-boxed exceptions) and
      # the license/ban/source policy. A new advisory, an exception whose
      # review date has passed, or a dependency outside the allow lists fails
      # here.
      - name: cargo deny (advisories, licenses, bans, sources)
        run: cargo deny check
