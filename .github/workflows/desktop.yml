name: Desktop

# Third-party actions are pinned to commit SHAs; Dependabot
# (.github/dependabot.yml, github-actions ecosystem) keeps them current.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static checks that do not need a compiler or the native engines. Kept in
  # its own job so a lint failure is reported in seconds instead of waiting for
  # the Rust matrix.
  lint:
    name: Lint (ESLint, Prettier, rustfmt, i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The formatting gate diffs the pushed range against its base, so the
          # base commit has to be in the clone.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: rustfmt
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Translation tables (en/tr parity)
        run: npm run i18n:audit -- --check
      - name: Formatting gate (files added by this change)
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm run format:gate
          npm run format:gate:rust
      # Neither rustfmt nor Prettier has been run over the whole code base yet;
      # the counts below are the backlog. Once `npm run format` and
      # `npm run fmt:rust` have been committed, add `--all-changed` to the
      # gate above (or replace it with a plain repository-wide check).
      - name: Formatting backlog (informational)
        run: |
          npm run format:gate -- --repo
          npm run format:gate:rust -- --repo
      # Every engine download must be covered by a pinned SHA-256. The fetch
      # scripts themselves are the source of truth (they hard-fail on an
      # unpinned download), so this only proves the lock has no gaps before a
      # Windows runner spends time downloading.
      - name: Engine artifact lock coverage
        run: |
          pwsh -NoProfile -File scripts/fetch-engines.ps1 -VerifyLock
          pwsh -NoProfile -File scripts/fetch-engines-android.ps1 -VerifyLock

  frontend:
    name: Frontend (tests, type check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Production build
        run: npx vite build
      - name: Bundle budget
        run: npm run bundle:check

  # Android-only compile errors (a desktop-only API behind the wrong cfg, a
  # method missing from the mobile plugin build, …) do not show up in the
  # desktop workspace check. Cross-checking the mobile target on every push/PR
  # is what keeps a release tag from failing on Android for a reason that was
  # catchable here in minutes. It caught the `plugin_install_from_dialog`
  # regression that broke the v3.2.1 Android build.
  android-target:
    name: Android target compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Android NDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;27.3.13750724" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - run: npm ci
      # The Tauri build script embeds the frontend, so ../dist has to exist.
      - name: Frontend for the Tauri build script
        run: npm run build
      - name: Stub the engine resources
        run: |
          mkdir -p src-tauri/resources/engines
          echo "Engine binaries are fetched by scripts/fetch-engines.ps1." > src-tauri/resources/engines/README.txt
      - name: cargo check (aarch64-linux-android)
        shell: bash
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang"
          cargo check -p pdf-swiss-army-knife --target aarch64-linux-android

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # The src-tauri build script embeds the frontend, so ../dist has to exist
      # before the workspace (including src-tauri) compiles.
      - name: Frontend for the Tauri build script
        run: |
          npm ci
          npm run build
      # Engine binaries are fetched at build time, but tauri-build validates the
      # resources glob even for `cargo test`; a placeholder keeps it matching.
      - name: Stub the engine resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources/engines
          echo "Engine binaries are fetched by scripts/fetch-engines.ps1." > src-tauri/resources/engines/README.txt
      # The bundled engines are Windows binaries; only the Windows runner can
      # exercise the engine-dependent pdfcore integration tests (raster
      # compression, OCR, rendering). Linux/macOS run the engine-free suites
      # plus a full workspace compile so cross-platform build breakage shows up.
      - name: Fetch engines (Windows)
        if: runner.os == 'Windows'
        run: npm run engines:fetch
      # Clippy runs on the runner that has the full engine set so the
      # cfg(windows) paths are compiled too.
      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests (Windows, with engines)
        if: runner.os == 'Windows'
        run: cargo test --workspace
      # officecore has no native engine dependency at all, so its integration
      # tests (golden fixtures, format round trips, the README contract) run on
      # every platform. pdfcore and aicore stay on --lib: most of their
      # integration tests need pdfium/tesseract, which only ship for Windows.
      - name: Engine-free tests
        if: runner.os != 'Windows'
        run: |
          cargo test -p officecore
          cargo test -p pdfcore -p aicore --lib
      - name: Workspace compile
        if: runner.os != 'Windows'
        run: cargo build --workspace
      - name: Release build (library crates)
        run: cargo build --release -p officecore -p pdfcore -p aicore

  # The workspace declares a rust-version; this job proves the declaration is
  # true instead of trusting it. Cargo.lock already contains crates that need
  # edition 2024 - the declaration used to say 1.82, which no longer built.
  msrv:
    name: MSRV (declared Rust version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master branch
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: The pin below and Cargo.toml must agree
        run: |
          declared=$(node -p "require('fs').readFileSync('Cargo.toml','utf8').match(/rust-version = \"([^\"]+)\"/)[1]")
          echo "Cargo.toml declares rust-version $declared"
          if [ "$declared" != "1.89" ]; then
            echo "::error::Cargo.toml declares $declared but this job pins 1.89.0 - bump both together."
            exit 1
          fi
      - name: Library crates build with the declared MSRV
        run: cargo check -p officecore -p pdfcore -p aicore -p synccore

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome-extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chrome-extension/package-lock.json
      - run: npm ci
      # Fonts and pdf.js assets are generated (public/fonts is not in git).
      - run: npm run assets
      - run: npm run test
      - run: npm run build
      - run: npm run verify
      # Headless Chrome runs the in-page self test (pdf.js worker + canvas) and
      # the context-menu deep-link checks against the built dist. The GitHub
      # ubuntu image ships Google Chrome; the preview server serves the build.
      - name: Browser self test (headless Chrome)
        run: |
          npm run preview &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID" EXIT
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4173/app.html > /dev/null; then break; fi
            sleep 1
          done
          npm run selftest:browser

  # Blocking on purpose: a known-vulnerable dependency is a release blocker,
  # not a note in the log. Fix or override an advisory explicitly.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (high)
        run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          # Prebuilt binaries: keeps the audit job under a minute instead of
          # compiling these tools on every push.
          tool: cargo-audit,cargo-deny
      # cargo audit is the quick gate; deny.toml is the reviewed policy with an
      # owner and a review date for every ignored advisory.
      - name: cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0429
      # `deny.toml` owns the advisory policy (owned, time-boxed exceptions).
      # A new advisory, or an exception whose review date has passed, fails here.
      - name: cargo deny (advisories)
        run: cargo deny check advisories
