name: Auto release tag

# Publishing a release used to need a manual `git push origin vX.Y.Z`. This
# workflow does it when a merge to master changes the version, but only after
# the Desktop workflow for that same commit has finished **successfully**: a
# version bump whose CI is red must not produce a tag (or a release).
#
# A tag created with GITHUB_TOKEN does not trigger `push: tags` workflows
# (GitHub's recursion guard), so Release and Android are dispatched explicitly
# on the new tag. Their tag-only steps (release keystore requirement,
# provenance attestation, release upload) still run because github.ref is
# refs/tags/vX.Y.Z. A tag that already exists (pushed by hand) is left alone.

on:
  workflow_run:
    workflows: ["Desktop"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  # Read-only at the workflow level; the jobs below ask for what they write.
  contents: read

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the version and start the release builds
    permissions:
      # Creating the tag.
      contents: write
      # Dispatching release.yml and android.yml on it.
      actions: write
    # The gate: a push-to-master Desktop run that passed. Manual dispatch skips
    # the gate on purpose (a human decided the commit is good). The repository
    # comparison keeps the trust boundary in the file itself: a `workflow_run`
    # raised by a fork can never reach the tag step.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      # No checkout: this job only reads four files, and it reads them from the
      # exact commit it is about to tag, through the Contents API. Checking the
      # triggering run's SHA out was flagged as a dangerous workflow pattern
      # (OpenSSF Scorecard, Dangerous-Workflow) because a `workflow_run`
      # checkout is the shape of a fork-code-with-secrets attack; dropping it
      # also keeps the write-scoped token out of a working tree. Adding a
      # checkout back reintroduces the finding - fetch what you need instead.
      - name: Tag and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # Read the files the version gate compares from the same commit the
          # tag will point at, so the check and the tag can never disagree.
          fetch() {
            mkdir -p "$(dirname "$1")"
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$REPO/contents/$1?ref=$TARGET_SHA" > "$1"
          }
          for file in package.json src-tauri/tauri.conf.json Cargo.toml \
                      src-tauri/gen/android/app/tauri.properties; do
            fetch "$file"
          done
          version=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$version" != "$tauri" ] || [ "$version" != "$cargo" ]; then
            echo "::error::version mismatch: package.json=$version tauri.conf.json=$tauri Cargo.toml=$cargo"
            exit 1
          fi
          props="src-tauri/gen/android/app/tauri.properties"
          android_name=$(sed -n 's/^.*versionName=//p' "$props" | head -n1 | tr -d '\r')
          android_code=$(sed -n 's/^.*versionCode=//p' "$props" | head -n1 | tr -d '\r')
          IFS='.' read -r major minor patch <<< "$version"
          expected_code=$((major * 1000000 + minor * 1000 + patch))
          if [ "$version" != "$android_name" ] || [ "$android_code" != "$expected_code" ]; then
            echo "::error::Android metadata mismatch: tauri.properties has versionName=$android_name versionCode=$android_code, expected $version / $expected_code"
            exit 1
          fi
          # The release notes are part of the gate: v7.12.0 was tagged without
          # its CHANGELOG section and store changelog, and the publish job then
          # failed with the tag already pushed.
          fetch CHANGELOG.md
          fetch scripts/changelog-section.mjs
          fetch scripts/release-guard.mjs
          fetch "fastlane/metadata/android/en-US/changelogs/$expected_code.txt"
          node scripts/release-guard.mjs --tag "v$version"
          tag="v$version"
          if gh api "repos/$REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$TARGET_SHA" > /dev/null
          echo "created $tag at $TARGET_SHA"
          gh workflow run release.yml --repo "$REPO" --ref "$tag"
          gh workflow run android.yml --repo "$REPO" --ref "$tag"
          echo "dispatched release.yml and android.yml on $tag"
