name: Release

# Third-party actions are pinned to commit SHAs; Dependabot
# (.github/dependabot.yml, github-actions ecosystem) keeps them current.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer and portable package
    runs-on: windows-latest
    permissions:
      contents: write
      # Needed by actions/attest-build-provenance below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: npm ci
      - name: Fetch bundled engines (pdfium, qpdf, tesseract, fonts)
        run: npm run engines:fetch
      - name: Type check and tests
        run: |
          npx tsc --noEmit
          npm test
          cargo test --workspace
      # The signing key turns on the updater artifacts (with
      # createUpdaterArtifacts: true the NSIS installer itself is signed:
      # `*_x64-setup.exe` + `.sig`), which scripts/make-latest-json.mjs turns
      # into latest.json below. `createUpdaterArtifacts` fails the build when
      # no key is provided, so without the secret the flag is switched off via
      # a merged config and no updater artifacts are produced (the release
      # then has no latest.json and the in-app check falls back to the release
      # page).
      - name: Tauri release build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $pubkey = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          $updaterOff = $false
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; updater artifacts were skipped."
            $updaterOff = $true
          } elseif ($pubkey -eq "PLACEHOLDER_UPDATER_PUBKEY") {
            # tauri-cli decodes the configured pubkey while signing, so with
            # the placeholder still in place a signed build would fail; the
            # release ships without an updater manifest until the owner sets
            # the real public key.
            Write-Host "::warning::plugins.updater.pubkey is still the placeholder; updater artifacts were skipped. Replace it with the real public key."
            $updaterOff = $true
          }
          if ($updaterOff) {
            Set-Content -Path updater-off.json -Encoding ascii -Value '{"bundle":{"createUpdaterArtifacts":false}}'
            npx tauri build --config updater-off.json
          } else {
            npm run tauri build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package installer and portable ZIP
        run: npm run package
      # Updater manifest (`release-artifacts/latest.json`) plus the signed
      # updater artifact it points at. Exits 0 without writing anything when
      # the build produced no updater artifacts (no signing key).
      - name: Update manifest (latest.json)
        run: node scripts/make-latest-json.mjs
      - name: Build info
        run: npm run build:info

      # A bill of materials for both dependency graphs, generated from the
      # lockfiles that the build actually used and attached to the release
      # next to the installer. CycloneDX JSON so scanners can read it.
      # `file:` (not `path:`) because current syft only accepts a directory for
      # path sources; syft-version is pinned so the SBOM toolchain is as
      # reproducible as the action itself.
      - name: SBOM (Rust, CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ./Cargo.lock
          format: cyclonedx-json
          output-file: release-artifacts/sbom-rust.cyclonedx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: SBOM (npm, CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ./package-lock.json
          format: cyclonedx-json
          output-file: release-artifacts/sbom-npm.cyclonedx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release-artifacts -File | Where-Object { $_.Name -notlike "SHA256SUMS*" } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release-artifacts/SHA256SUMS.txt -Encoding ASCII
          Get-Content release-artifacts/SHA256SUMS.txt

      # Signed provenance for every release asset (installer, portable ZIP,
      # checksums, SBOMs). Users verify with:
      #   gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omnioffice-windows
          path: release-artifacts/*
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "OmniOffice $tag" --notes-file CHANGELOG.md }
          Get-ChildItem release-artifacts -File | ForEach-Object { gh release upload $tag $_.FullName --clobber }

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: package.json, Cargo.toml, tauri.conf.json and Android metadata agree
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8')).version;
            const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')).version;
            const cargo = fs.readFileSync('Cargo.toml','utf8').match(/version = \"([^\"]+)\"/)[1];
            const props = fs.readFileSync('src-tauri/gen/android/app/tauri.properties','utf8');
            const androidName = (props.match(/versionName=([^\r\n]+)/) || [])[1];
            const androidCode = (props.match(/versionCode=([0-9]+)/) || [])[1];
            const [major, minor, patch] = pkg.split('.').map(Number);
            const expectedCode = String(major * 1000000 + minor * 1000 + patch);
            const tag = process.env.GITHUB_REF_NAME || '';
            console.log({pkg, tauri, cargo, androidName, androidCode, tag});
            if (pkg !== tauri || pkg !== cargo) throw new Error('version mismatch');
            if (androidName !== pkg) throw new Error('Android versionName mismatch');
            if (androidCode !== expectedCode) throw new Error('Android versionCode mismatch');
            if (tag.startsWith('v') && tag.slice(1) !== pkg) throw new Error('tag does not match version');
          "
