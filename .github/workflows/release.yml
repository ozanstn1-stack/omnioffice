name: Release

# Third-party actions are pinned to commit SHAs; Dependabot
# (.github/dependabot.yml, github-actions ecosystem) keeps them current.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release build per tag: a second dispatch for the same tag must not run in
# parallel with the first, and it must never be cancelled midway (a half
# uploaded release is worse than a slow one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer and portable package
    runs-on: windows-latest
    # The build must not start before every version file agrees; a mismatched
    # package.json/tauri.conf.json/Cargo.toml/tauri.properties pair used to be
    # discovered by `tauri build` halfway through the release.
    needs: version-consistency
    permissions:
      contents: write
      # SignPath reads back the artifact uploaded in the signing step.
      actions: read
      # Needed by actions/attest-build-provenance below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: npm ci
      - name: Fetch bundled engines (pdfium, qpdf, tesseract, fonts)
        run: npm run engines:fetch
      - name: Type check and tests
        run: |
          npx tsc --noEmit
          npm test
          cargo test --workspace
      # The same gates desktop.yml runs on pull requests, repeated here because
      # a tag build must not publish an artifact that never passed lint, the
      # i18n audit, the bundle budget or clippy.
      - name: Quality gates (lint, i18n, bundle budget, clippy)
        run: |
          npm run lint
          npm run i18n:audit -- --check
          npm run build
          npm run bundle:check
          cargo clippy --workspace --all-targets -- -D warnings
      # The signing key turns on the updater artifacts (with
      # createUpdaterArtifacts: true the NSIS installer itself is signed:
      # `*_x64-setup.exe` + `.sig`), which scripts/make-latest-json.mjs turns
      # into latest.json below. `createUpdaterArtifacts` fails the build when
      # no key is provided, so without the secret the flag is switched off via
      # a merged config and no updater artifacts are produced (the release
      # then has no latest.json and the in-app check falls back to the release
      # page).
      - name: Tauri release build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $pubkey = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          $updaterOff = $false
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; updater artifacts were skipped."
            $updaterOff = $true
          } elseif ($pubkey -eq "PLACEHOLDER_UPDATER_PUBKEY") {
            # tauri-cli decodes the configured pubkey while signing, so with
            # the placeholder still in place a signed build would fail; the
            # release ships without an updater manifest until the owner sets
            # the real public key.
            Write-Host "::warning::plugins.updater.pubkey is still the placeholder; updater artifacts were skipped. Replace it with the real public key."
            $updaterOff = $true
          }
          if ($updaterOff) {
            Set-Content -Path updater-off.json -Encoding ascii -Value '{"bundle":{"createUpdaterArtifacts":false}}'
            npx tauri build --config updater-off.json
          } else {
            npm run tauri build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # ---------------------------------------------------------------- signing
      # Authenticode signing is optional and provider-gated (#501): with no
      # signing secrets the job behaves exactly as before (unsigned installer),
      # so forks and secret-less runs keep working. See docs/signing.md for the
      # provider decision, required secrets and the verification commands.
      - name: Detect the Authenticode provider
        id: authenticode
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          if [ -n "${SIGNPATH_API_TOKEN:-}" ]; then provider="signpath"
          elif [ -n "${AZURE_CLIENT_SECRET:-}" ]; then provider="azure"
          elif [ -n "${WINDOWS_CERT_PFX:-}" ]; then provider="pfx"
          else provider="none"; fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          if [ "$provider" = "none" ]; then
            echo "::notice::No Authenticode secrets are configured; the installer stays unsigned."
          else
            echo "::notice::Authenticode provider: $provider"
          fi

      # A provider selected by one secret but missing another would fail deep in
      # the signing action with an opaque error. Fail here instead, with the
      # missing names, so adding secrets is a two-minute fix (D10).
      - name: Check the Authenticode configuration
        if: steps.authenticode.outputs.provider != 'none'
        shell: pwsh
        env:
          PROVIDER: ${{ steps.authenticode.outputs.provider }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $provider = $env:PROVIDER
          $required = switch ($provider) {
            'signpath' {
              @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG',
                'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG')
            }
            'azure' {
              @('AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET',
                'AZURE_TS_ENDPOINT', 'AZURE_TS_ACCOUNT', 'AZURE_TS_PROFILE')
            }
            'pfx' { @('WINDOWS_CERT_PFX', 'WINDOWS_CERT_PASSWORD') }
            default { @() }
          }
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            Write-Error "Authenticode provider '$provider' is selected but these secrets are missing: $($missing -join ', '). Add them, or remove the provider's secrets to build an unsigned installer."
            exit 1
          }
          Write-Host "Authenticode preflight: $provider has all $($required.Count) required secrets."

      - name: Sign the app exe and the installer (PFX / Azure Trusted Signing)
        if: steps.authenticode.outputs.provider == 'pfx' || steps.authenticode.outputs.provider == 'azure'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
        run: pwsh -NoProfile -File .github/scripts/windows-signing.ps1 -Action sign -Provider ${{ steps.authenticode.outputs.provider }}

      - name: Stage the files for SignPath
        if: steps.authenticode.outputs.provider == 'signpath'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $stage = Join-Path $env:RUNNER_TEMP 'authenticode'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $appExe = 'target/release/OmniOffice.exe'
          if (-not (Test-Path $appExe)) { $appExe = 'target/release/pdf-swiss-army-knife.exe' }
          $installer = Get-ChildItem target/release/bundle/nsis -Filter "*-$version-*-setup.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "the NSIS installer for $version was not found" }
          $manifest = @{}
          foreach ($file in @($appExe, $installer.FullName)) {
            $name = Split-Path -Leaf $file
            Copy-Item $file (Join-Path $stage $name) -Force
            $manifest[$name] = (Resolve-Path $file).Path
          }
          $manifest | ConvertTo-Json | Set-Content (Join-Path $stage 'manifest.json') -Encoding ascii
          Get-ChildItem $stage | Select-Object Name, Length

      - name: Upload the files for SignPath
        id: authenticode-upload
        if: steps.authenticode.outputs.provider == 'signpath'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authenticode-input
          path: ${{ runner.temp }}/authenticode/*
          if-no-files-found: error

      - name: Sign through SignPath.io
        if: steps.authenticode.outputs.provider == 'signpath'
        uses: SignPath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.authenticode-upload.outputs.artifact-id }}
          output-artifact-directory: ${{ runner.temp }}/authenticode-signed
          wait-for-completion: true

      - name: Restore the SignPath-signed files
        if: steps.authenticode.outputs.provider == 'signpath'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'authenticode'
          $signed = Join-Path $env:RUNNER_TEMP 'authenticode-signed'
          $manifest = Get-Content (Join-Path $stage 'manifest.json') -Raw | ConvertFrom-Json
          $found = Get-ChildItem $signed -Recurse -File
          foreach ($entry in $manifest.PSObject.Properties) {
            $signedFile = $found | Where-Object { $_.Name -eq $entry.Name } | Select-Object -First 1
            if (-not $signedFile) { throw "SignPath did not return $($entry.Name)" }
            Copy-Item $signedFile.FullName $entry.Value -Force
            Write-Host "restored the signed $($entry.Name)"
          }

      - name: Verify the Authenticode signature
        if: steps.authenticode.outputs.provider != 'none'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/windows-signing.ps1 -Action verify

      # Authenticode rewrote the installer after Tauri produced the updater
      # signature, so that minisign signature is refreshed before latest.json
      # is generated (otherwise the in-app update would never verify).
      - name: Refresh the updater signature over the signed installer
        if: steps.authenticode.outputs.provider != 'none'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pwsh -NoProfile -File .github/scripts/refresh-updater-signature.ps1

      - name: Package installer and portable ZIP
        run: npm run package
      - name: Verify the packaged installer is signed
        if: steps.authenticode.outputs.provider != 'none'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          pwsh -NoProfile -File .github/scripts/windows-signing.ps1 -Action verify -Paths "release-artifacts/OmniOffice-Setup-$version.exe"
      # Updater manifest (`release-artifacts/latest.json`) plus the signed
      # updater artifact it points at. Exits 0 without writing anything when
      # the build produced no updater artifacts (no signing key).
      - name: Update manifest (latest.json)
        run: node scripts/make-latest-json.mjs
      - name: Build info
        run: npm run build:info

      # A bill of materials for both dependency graphs, generated from the
      # lockfiles that the build actually used and attached to the release
      # next to the installer. CycloneDX JSON so scanners can read it.
      # `file:` (not `path:`) because current syft only accepts a directory for
      # path sources; syft-version is pinned so the SBOM toolchain is as
      # reproducible as the action itself.
      - name: SBOM (Rust, CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ./Cargo.lock
          format: cyclonedx-json
          output-file: release-artifacts/sbom-rust.cyclonedx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: SBOM (npm, CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ./package-lock.json
          format: cyclonedx-json
          output-file: release-artifacts/sbom-npm.cyclonedx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release-artifacts -File | Where-Object { $_.Name -notlike "SHA256SUMS*" } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release-artifacts/SHA256SUMS.txt -Encoding ASCII
          Get-Content release-artifacts/SHA256SUMS.txt

      # Signed provenance for every release asset (installer, portable ZIP,
      # checksums, SBOMs). Users verify with:
      #   gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnioffice-windows
          path: release-artifacts/*
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Release notes are only this version's CHANGELOG section; a missing
          # section fails the job instead of publishing the whole file.
          node scripts/changelog-section.mjs $version > release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "OmniOffice $tag" --notes-file release-notes.md
          } else {
            gh release edit $tag --notes-file release-notes.md
          }
          # No --clobber: a published asset is immutable. If a name clashes,
          # the upload fails loudly instead of overwriting what users may have
          # already downloaded (the repository also enables GitHub's immutable
          # releases, which enforces the same rule on the API side).
          Get-ChildItem release-artifacts -File | ForEach-Object { gh release upload $tag $_.FullName }

  linux:
    name: Linux packages
    needs: version-consistency
    # The .deb and .AppImage come from a reusable workflow so the same build is
    # tested by a manual dispatch and attached by a tag. The release creation
    # and the asset upload inside it are tag-guarded.
    uses: ./.github/workflows/linux-package.yml
    permissions:
      contents: write

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: package.json, Cargo.toml, tauri.conf.json and Android metadata agree
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8')).version;
            const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')).version;
            const cargo = fs.readFileSync('Cargo.toml','utf8').match(/version = \"([^\"]+)\"/)[1];
            const props = fs.readFileSync('src-tauri/gen/android/app/tauri.properties','utf8');
            const androidName = (props.match(/versionName=([^\r\n]+)/) || [])[1];
            const androidCode = (props.match(/versionCode=([0-9]+)/) || [])[1];
            const [major, minor, patch] = pkg.split('.').map(Number);
            const expectedCode = String(major * 1000000 + minor * 1000 + patch);
            const tag = process.env.GITHUB_REF_NAME || '';
            console.log({pkg, tauri, cargo, androidName, androidCode, tag});
            if (pkg !== tauri || pkg !== cargo) throw new Error('version mismatch');
            if (androidName !== pkg) throw new Error('Android versionName mismatch');
            if (androidCode !== expectedCode) throw new Error('Android versionCode mismatch');
            if (tag.startsWith('v') && tag.slice(1) !== pkg) throw new Error('tag does not match version');
          "
