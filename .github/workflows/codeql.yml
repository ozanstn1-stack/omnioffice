name: CodeQL

# Static analysis for the two surfaces this repository actually ships from
# source: the TypeScript frontend and the GitHub Actions workflows themselves
# (E5 supply chain). Rust is not covered here - CodeQL has no Rust extractor, and
# `cargo clippy -- -D warnings` plus the fuzz jobs are the Rust gate.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so a new query pack reaches the code even without a push.
    - cron: "27 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: ${{ matrix.language }}
      # Both analysed languages are interpreted, so there is no build step; the
      # frontend is analysed from source to keep the job short.
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: "/language:${{ matrix.language }}"
