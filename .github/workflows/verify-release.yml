name: Verify release assets (APK + EXE)

# Guarantees that every tagged release carries both the Windows EXE installers
# and the signed Android APKs/AABs before it can be considered complete.
# Dispatched directly at the end of Release and Android tag builds (avoiding
# GitHub's GITHUB_TOKEN `workflow_run` suppression), or run manually for a tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (for example v8.3.1)"
        required: true
        type: string
      sha:
        description: "Commit SHA of the release tag (optional; enables sibling workflow checks)"
        required: false
        default: ""
        type: string
      caller:
        description: "Workflow that dispatched verification (release, android, or empty for manual)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: verify-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify EXE and APK release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check sibling workflows and verify APK + EXE release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ inputs.sha }}
          CALLER: ${{ inputs.caller }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$TAG' (expected vX.Y.Z)."
            exit 1
          fi
          VERSION="${TAG#v}"

          if [ -n "${RUN_SHA:-}" ]; then
            if [[ ! "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid commit SHA '$RUN_SHA' (expected 40 lowercase hex characters)."
              exit 1
            fi

            case "${CALLER:-}" in
              release) workflows=(android.yml) ;;
              android) workflows=(release.yml) ;;
              *) workflows=(release.yml android.yml) ;;
            esac

            for wf in "${workflows[@]}"; do
              for attempt in 1 2; do
                state=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$RUN_SHA&per_page=10" \
                  | jq -r --arg tag "$TAG" '([.workflow_runs[] | select(.head_branch == $tag)][0] // {}) | "\(.status // "missing"):\(.conclusion // "none")"')
                status="${state%%:*}"
                conclusion="${state#*:}"
                echo "Workflow $wf for $TAG ($RUN_SHA) [attempt $attempt]: status=$status conclusion=$conclusion"
                if [ "$status" = "in_progress" ] && [ "$attempt" -eq 1 ]; then
                  sleep 15
                  continue
                fi
                break
              done

              if [ "$status" = "missing" ] || [ "$status" = "queued" ] || [ "$status" = "in_progress" ] || [ "$status" = "waiting" ]; then
                echo "::notice::Waiting for sibling workflow $wf to complete before final APK+EXE verification."
                exit 0
              fi
              if [ "$conclusion" != "success" ]; then
                echo "::error::Sibling workflow $wf failed ($conclusion) for release $TAG."
                exit 1
              fi
            done
          fi

          assets_json=$(gh release view "$TAG" --repo "$REPO" --json assets)
          required=(
            "OmniOffice-Setup-${VERSION}.exe"
            "OmniOffice_${VERSION}_x64-setup.exe"
            "OmniOffice-Portable-${VERSION}.zip"
            "OmniOffice-Android-${VERSION}-arm64-v8a.apk"
            "OmniOffice-Android-${VERSION}-armeabi-v7a.apk"
            "OmniOffice-Android-${VERSION}-arm64-v8a.aab"
            "OmniOffice-Android-${VERSION}-armeabi-v7a.aab"
            "SHA256SUMS.txt"
            "SHA256SUMS-android.txt"
          )

          missing=0
          {
            echo "## Release Completeness Check ($TAG)"
            echo ""
            echo "| Asset | Status | Size |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for name in "${required[@]}"; do
            size=$(echo "$assets_json" | jq -r --arg n "$name" '.assets[] | select(.name == $n) | .size' | head -n1)
            if [ -z "$size" ] || [ "$size" = "0" ]; then
              echo "::error::Missing or empty required release asset: $name"
              echo "| \`$name\` | MISSING | - |" >> "$GITHUB_STEP_SUMMARY"
              missing=$((missing + 1))
            else
              mb=$(awk "BEGIN { printf \"%.1f MB\", $size / 1048576 }")
              echo "| \`$name\` | OK | $mb |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing mandatory APK/EXE release asset(s) missing on $TAG."
            exit 1
          fi
          echo "Release $TAG verified: all Windows EXE and Android APK/AAB assets are present."
