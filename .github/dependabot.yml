# Dependency updates. The desktop and Android workflows install from these
# three ecosystems, so all of them are watched here; the audit job in
# .github/workflows/desktop.yml fails the build on a known vulnerable version,
# this keeps the pull requests coming before that happens.
#
# Limits and groups keep each wave reviewable: a fresh repository opened the
# default five pull requests per ecosystem at once (18 in one go), and the
# GitHub Actions bumps are mechanical enough to share a single pull request.
# Major bumps of a real dependency stay on their own so they can be reviewed
# and migrated one at a time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /chrome-extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      extension:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      rust:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
